name: QuantumATi Durable Missions Checks
on:
  push:
    branches:
      - feature/quantumati-durable-missions-v1
    paths:
      - 'extensions/quantumati-control-center/**'
      - '.github/workflows/quantumati-durable-missions.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  durable-read-only-missions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          for file in extensions/quantumati-control-center/*.cjs extensions/quantumati-control-center/test/*.cjs; do
            node --check "$file"
          done
      - name: All QuantumATi extension unit and integration tests
        run: node --test extensions/quantumati-control-center/test/*.test.cjs
