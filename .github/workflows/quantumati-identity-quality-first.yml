name: QuantumATi Identity Quality Gate
on:
  push:
    branches:
      - feature/quantumati-identity-quality-first-v1
    paths:
      - 'product.json'
      - 'extensions/quantumati-control-center/**'
      - '.github/workflows/quantumati-identity-quality-first.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity-and-extension-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout the QuantumATi feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          for file in extensions/quantumati-control-center/*.cjs extensions/quantumati-control-center/ui/*.js extensions/quantumati-control-center/test/*.cjs; do
            node --check "$file"
          done
      - name: Run the whole QuantumATi extension test suite
        run: node --test extensions/quantumati-control-center/test/*.test.cjs
