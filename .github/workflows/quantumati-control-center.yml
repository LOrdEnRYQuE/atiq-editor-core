name: QuantumATi Control Center Checks

on:
  push:
    branches:
      - feature/quantumati-project-control-center
    paths:
      - 'extensions/quantumati-control-center/**'
      - '.github/workflows/quantumati-control-center.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-center:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in extensions/quantumati-control-center/*.cjs extensions/quantumati-control-center/test/*.cjs; do
            node --check "$file"
          done
      - name: Run QuantumATi focused tests
        run: node --test extensions/quantumati-control-center/test/*.test.cjs
